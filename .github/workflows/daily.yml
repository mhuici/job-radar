name: daily

on:
  # Uncomment to run every weekday at 08:17 in Argentina (UTC-3) once the secrets are set.
  # schedule:
  #   - cron: "17 11 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the digest instead of saving and emailing"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm start
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MODEL: ${{ vars.MODEL }}
